[package]
name = "zero-rs"
version = "0.1.0"
edition = "2021"
description = "kshell zero 的 Rust 骨架:单 routine 拨入 kernel,证明分布式跨语言。"

[dependencies]
routine = { path = "../routine-rs" }
async-trait = "0.1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
