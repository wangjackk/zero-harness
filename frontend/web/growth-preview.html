<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>growth preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161f; }
      #app { height: 100%; display: flex; }
      /* 垫在 HUD 底下的「内容」：右下角原本就是聊天气泡和 done 标签的地盘。
         树底下不再有暗雾，所以这几块深浅不同的条用来核对
         「没有底板时，枝和叶压在别的内容上还分不分得清」。
         亮度、饱和度按聊天气泡取，不是装饰。 */
      .under { position: fixed; right: 0; bottom: 0; width: 460px; height: 480px; z-index: 10; pointer-events: none; }
      .under i { position: absolute; display: block; border-radius: 12px; }
      .under .b1 { right: 24px; bottom: 300px; width: 300px; height: 90px; background: #2b2350; opacity: 0.9; }
      .under .b2 { right: 40px; bottom: 240px; width: 190px; height: 44px; background: #3b3358; opacity: 0.85; }
      .under .b3 { right: 18px; bottom: 120px; width: 250px; height: 100px; background: #1d2430; opacity: 0.9; }
      .under .b4 { right: 60px; bottom: 70px;  width: 120px; height: 30px; background: #d8cfa8; opacity: 0.22; }
      .under .b5 { right: 150px; bottom: 350px; width: 200px; height: 26px; background: #7c8b9c; opacity: 0.18; }
      /* 一条贯穿的水平亮线：树冠跨过它时，看边缘是不是还有一圈暗 */
      .under .b6 { left: 0; bottom: 210px; width: 100%; height: 1px; background: #8fa2b8; opacity: 0.3; }
    </style>
  </head>
  <body>
    <div class="under">
      <i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/growth-preview.ts"></script>
  </body>
</html>
