[project]
name = "zero"
version = "0.2.0"
description = "zero：内嵌 kernel 上的 prime agent 应用（routine SDK + app/ 业务）"
requires-python = ">=3.10"
dependencies = [
    "routine",
    # app/ 业务 routine 运行时依赖
    "fastapi",
    "uvicorn",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "openai>=2.45.0",
    "asyncssh>=2.24.0",
    "ipykernel>=6.29.0",
    "jupyter_client>=8.6.0",
    "websockets>=13.0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",
    "soundfile>=0.14.0",
    "pyzmq>=26.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "ruamel-yaml>=0.19.1",
    "typesafe-sdk>=0.7.0",
]

# routine SDK 经 path 依赖 + editable：改 routine-py 源码重启 server 即生效。
[tool.uv.sources]
routine = { path = "routine-py", editable = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
