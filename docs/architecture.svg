<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <rect width="1000" height="680" fill="#FFFFFF"/>

  <!-- 设备 A · Python hub (内嵌 kernel) -->
  <rect x="55" y="60" width="300" height="330" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="70" y="84" font-size="11" fill="#94A3B8">device A · 宿主机</text>
  <rect x="85" y="100" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  <text x="205" y="145" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E293B">routine hub</text>
  <text x="205" y="170" text-anchor="middle" font-size="12" fill="#64748B">Python · zero</text>
  <rect x="85" y="240" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/>
  <text x="205" y="285" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">kernel</text>
  <text x="205" y="310" text-anchor="middle" font-size="12" fill="#64748B">Python · 进程内嵌 · grpc dial-in 口</text>
  <line x1="205" y1="210" x2="205" y2="240" stroke="#94A3B8" stroke-width="2"/>

  <!-- 设备 B · Rust hub -->
  <rect x="665" y="60" width="280" height="170" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="680" y="84" font-size="11" fill="#94A3B8">device B · 车端</text>
  <rect x="695" y="100" width="220" height="105" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="2.5"/>
  <text x="805" y="145" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E293B">routine hub</text>
  <text x="805" y="170" text-anchor="middle" font-size="12" fill="#64748B">Rust · zero-rs</text>

  <!-- 设备 C · TypeScript hub -->
  <rect x="665" y="300" width="280" height="170" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="680" y="324" font-size="11" fill="#94A3B8">device C</text>
  <rect x="695" y="340" width="220" height="105" rx="10" fill="#FFFFFF" stroke="#0891B2" stroke-width="2.5"/>
  <text x="805" y="385" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E293B">routine hub</text>
  <text x="805" y="410" text-anchor="middle" font-size="12" fill="#64748B">TypeScript · zero-ts</text>

  <!-- 更多 hub -->
  <rect x="360" y="520" width="220" height="105" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="565" text-anchor="middle" font-size="13" fill="#94A3B8">… more hubs</text>
  <text x="470" y="588" text-anchor="middle" font-size="11" fill="#B0BCCB">any language · any device</text>

  <!-- 连接: B/C 拨入 device A 内嵌 kernel -->
  <line x1="695" y1="152" x2="325" y2="180" stroke="#CBD5E1" stroke-width="2"/>
  <text x="510" y="150" font-size="11" fill="#94A3B8">grpc dial-in</text>
  <line x1="695" y1="392" x2="325" y2="310" stroke="#CBD5E1" stroke-width="2"/>
  <text x="510" y="370" font-size="11" fill="#94A3B8">grpc dial-in</text>
  <line x1="580" y1="560" x2="340" y2="360" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 5"/>
</svg>
