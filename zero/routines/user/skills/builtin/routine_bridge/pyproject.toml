[project]
name = "routine_bridge"
version = "0.1.0"
description = "zero routine skill: run_routine HTTP bridge for IPython kernel"
requires-python = ">=3.11"
dependencies = ["httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routine_bridge"]
