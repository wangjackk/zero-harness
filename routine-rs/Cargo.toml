[package]
name = "routine"
version = "0.1.0"
edition = "2021"
description = "Rust SDK/runtime for routine wire protocol."

[workspace]
members = [
    ".",
    "crates/routine-protocol",
    "crates/routine-core",
    "crates/routine-server",
]

[workspace.dependencies]
async-trait = "0.1.89"
futures = "0.3.32"
prost = "0.14.4"
prost-types = "0.14.4"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4"] }

[dependencies]
async-trait = { workspace = true }
routine-protocol = { path = "crates/routine-protocol" }
routine-core = { path = "crates/routine-core" }
routine-server = { path = "crates/routine-server" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
