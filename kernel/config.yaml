# as_grpc_server: kernel 作为 grpc server,routine 进程主动拨入.
# enable=false 或整段注释 = 不起 server.
as_grpc_server:
  enable: true
  address: 127.0.0.1:8888

# as_grpc_client: kernel 作为 grpc client,主动连 routine server.
# 整段注释 / 显式空 [] / 文件不存在 = 不连任何 server;只有显式写地址才连.
#as_grpc_client:
#  - address: 127.0.0.1:7777
